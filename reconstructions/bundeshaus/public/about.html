<h3>Building &amp; site</h3>
<p class="panel-note">Bern’s <a href="https://www.parlament.ch/en/%C3%BCber-das-parlament/parliament-building" target="_blank" rel="noopener noreferrer">Parliament Building<span class="sr-only"> (opens in a new tab)</span></a>, designed by Hans Wilhelm Auer and completed in 1902, stands between the Federal Palace’s east and west wings. In front, <a href="https://www.bern.ch/zu-gast-in-bern/sehenswurdigkeiten/bundesplatz/die-neugestaltung" target="_blank" rel="noopener noreferrer">Bundesplatz<span class="sr-only"> (opens in a new tab)</span></a> has 26 water jets representing Switzerland’s cantons.</p>
