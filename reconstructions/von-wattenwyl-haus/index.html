<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Beatrice von Wattenwyl-Haus · Reconstructions</title>
  <script>
    // Open the splat viewer straight away; where it is missing, or the page is
    // opened from disk (no streaming), this page shows a note instead.
    const viewer = 'public/lichtfeld-loma.html';
    const missing = () => { document.documentElement.dataset.missing = ''; };
    if (location.protocol === 'file:') missing();
    else fetch(viewer, { method: 'HEAD' }).then(response => response.ok ? location.replace(viewer) : missing(), missing);
  </script>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #000; color: #f2f2f3; font: 1rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    html:not([data-missing]) main { visibility: hidden; }
    main { max-width: 640px; margin: 0 auto; padding: 48px 24px; }
    h1 { margin: 0 0 8px; font-size: 1.75rem; line-height: 1.2; }
    p { color: #a3a3aa; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Beatrice von Wattenwyl-Haus</h1>
    <p>The splat viewer is not available here. Run <code>python tools/serve.py</code> from the repository root and open the address it prints.</p>
    <noscript><p><a href="public/lichtfeld-loma.html">Open the splat viewer</a>.</p></noscript>
  </main>
</body>
</html>
